apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-image
data:
  image: {{ include "cozy-lib.image" (list (.Values.ref | default "quay.io/org/app:v1") $) | quote }}
  parts: {{ include "cozy-lib.imageParts" (list (.Values.ref | default "quay.io/org/app:v1") $) | fromYaml | toJson | quote }}
  name: {{ include "cozy-lib.imageName" (list (.Values.name | default "quay.io/org/app") $) | quote }}
  entry: {{ include "cozy-lib.imageOverrideEntry" (list (.Values.name | default "quay.io/org/app") (index (.Values._cluster | default dict) "image-overrides")) | fromYaml | toJson | quote }}
