{{- if .Values.migrations.enabled }}
{{- $shouldRunMigrationHook := false }}
{{- $currentVersion := 0 }}
{{- $targetVersion := .Values.migrations.targetVersion | int }}
{{- /*
  Resolve migrations.etcdAdoptSkipBackup to the exact string migration 50
  matches. Two hazards, both silent:
    - the key is absent on a Platform Package that predates it, so `dig` supplies
      the default rather than letting the whole platform render fail;
    - the script tests for "1", so a bare bool renders "true" and the hatch is
      accepted, displayed in the Job spec, and ignored. Normalise through a
      string so a bool, a quoted "true" out of the Package CR's Values JSON, or
      a numeric 1 all land on the same answer.
  Anything unrecognised (nil, garbage) resolves to "0": taking the hatch must
  require an affirmative spelling, never a typo.
*/}}
{{- $skipBackupRaw := dig "etcdAdoptSkipBackup" false .Values.migrations }}
{{- $skipBackup := has (lower (printf "%v" $skipBackupRaw)) (list "1" "true" "yes") }}
{{- $configMap := lookup "v1" "ConfigMap" .Release.Namespace "cozystack-version" }}
{{- if $configMap }}
  {{- $currentVersion = dig "data" "version" "0" $configMap | int }}
  {{- if lt $currentVersion $targetVersion }}
    {{- $shouldRunMigrationHook = true }}
  {{- end }}
{{- end }}

{{- if $shouldRunMigrationHook }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cozystack-migration-hook
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        policy.cozystack.io/allow-to-apiserver: "true"
    spec:
      serviceAccountName: cozystack-migration-hook
      containers:
        - name: migration
          image: {{ .Values.migrations.image }}
          env:
            - name: NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: CURRENT_VERSION
              value: {{ $currentVersion | quote }}
            - name: TARGET_VERSION
              value: {{ $targetVersion | quote }}
            # Always emitted, including the "0" default, so the Job spec states
            # the cluster's safety posture outright: an operator reading the Job
            # can see whether the snapshot was skipped without diffing values.
            - name: ETCD_ADOPT_SKIP_BACKUP
              value: {{ $skipBackup | ternary "1" "0" | quote }}
            {{- /* Migrations 37, 50 and 54 write these images into live objects.
                   The table they have to follow is the one this render
                   carries: the cozystack-values Secret is a resource of this
                   release and still holds the previous values while a
                   pre-upgrade hook runs. An image the table leaves alone is not
                   passed, and the migration keeps its own default.
                   hack/image-override-defaults_test.bats holds these
                   references to the ones the migrations name. */}}
            {{- with include "cozystack.platform.imageOverrides" $ | fromYamlArray }}
            {{-   $ctx := dict "Values" (dict "cozystackImageOverrides" .) }}
            {{-   $cnpg := include "cozy-lib.cnpg.image" (list dict "ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie" $ctx) | fromYaml }}
            {{-   if ne $cnpg.image "ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie" }}
            - name: CNPG_SYSTEM_IMAGE
              value: {{ $cnpg.image | quote }}
            {{-     with $cnpg.major }}
            - name: CNPG_SYSTEM_IMAGE_MAJOR
              value: {{ . | quote }}
            {{-     end }}
            {{-   end }}
            {{-   $etcd := include "cozy-lib.imageWith" (list "ghcr.io/cozystack/etcd-operator:v0.5.2" .) }}
            {{-   if ne $etcd "ghcr.io/cozystack/etcd-operator:v0.5.2" }}
            - name: ETCD_OPERATOR_IMAGE
              value: {{ $etcd | quote }}
            {{-   end }}
            {{-   $redis := include "cozy-lib.imageWith" (list "redis:6.2.6-alpine" .) }}
            {{-   if ne $redis "redis:6.2.6-alpine" }}
            - name: REDIS_PIN_IMAGE
              value: {{ $redis | quote }}
            {{-   end }}
            {{- end }}
      restartPolicy: Never
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
  name: cozystack-migration-hook
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: cozystack-migration-hook
    namespace: {{ .Release.Namespace | quote }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cozystack-migration-hook
  annotations:
    helm.sh/hook: pre-upgrade,pre-install
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: hook-succeeded,before-hook-creation
{{- end }}
{{- end }}
