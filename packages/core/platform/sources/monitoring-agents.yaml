---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.monitoring-agents
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
    - name: default
      dependsOn:
        - cozystack.networking
        - cozystack.metrics-server
        - cozystack.victoria-metrics-operator
        - cozystack.vertical-pod-autoscaler
      libraries:
        - name: cozy-lib
          path: library/cozy-lib
      components:
        - name: monitoring-agents
          path: system/monitoring-agents
          libraries: ["cozy-lib"]
          install:
            releaseName: monitoring-agents
            namespace: cozy-monitoring
            privileged: true
