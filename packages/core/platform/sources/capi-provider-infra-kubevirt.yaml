---
apiVersion: cozystack.io/v1alpha1
kind: PackageSource
metadata:
  name: cozystack.capi-provider-infra-kubevirt
spec:
  sourceRef:
    kind: OCIRepository
    name: cozystack-packages
    namespace: cozy-system
    path: /
  variants:
  - name: default
    dependsOn:
    - cozystack.networking
    - cozystack.capi-operator
    - cozystack.kubevirt
    libraries:
    - name: cozy-lib
      path: library/cozy-lib
    components:
    - name: capi-providers-infraprovider
      path: system/capi-providers-infraprovider
      libraries: ["cozy-lib"]
      install:
        privileged: true
        namespace: cozy-cluster-api
        releaseName: capi-providers-infraprovider
  - name: kubevirt
    dependsOn:
    - cozystack.networking
    - cozystack.capi-operator
    - cozystack.kubevirt
    libraries:
    - name: cozy-lib
      path: library/cozy-lib
    components:
    - name: capi-providers-infraprovider
      path: system/capi-providers-infraprovider
      libraries: ["cozy-lib"]
      install:
        privileged: true
        namespace: cozy-cluster-api
        releaseName: capi-providers-infraprovider
