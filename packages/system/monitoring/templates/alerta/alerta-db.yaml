---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
{{- $existingCluster := lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace "alerta-db" }}
{{- /* Through the image override table, keeping the major version the
       cluster runs; see cozy-lib.cnpg.image. */}}
{{- $image := include "cozy-lib.cnpg.image" (list $existingCluster "ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie" $) | fromYaml }}
metadata:
  name: alerta-db
  {{- with $image.major }}
  annotations:
    postgres.cozystack.io/major: {{ . | quote }}
  {{- end }}
spec:
  instances: 2
  imageName: {{ $image.image }}
  {{- if .Values._cluster.scheduling }}
  {{- $rawConstraints := get .Values._cluster.scheduling "globalAppTopologySpreadConstraints" }}
  {{- if $rawConstraints }}
  {{- $rawConstraints | fromYaml | toYaml | nindent 2 }}
    labelSelector:
      matchLabels:
        cnpg.io/cluster: alerta-db
  {{- end }}
  {{- end }}
  storage:
    size: {{ required ".Values.alerta.storage is required" .Values.alerta.storage }}
    {{- with .Values.alerta.storageClassName }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    limits:
      cpu: "1"
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 512Mi

  monitoring:
    enablePodMonitor: true

  inheritedMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
