---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
{{- $existingCluster := lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace "seaweedfs-db" }}
{{- /* Through the image override table, keeping the major version the
       cluster runs; see cozy-lib.cnpg.image. */}}
{{- $image := include "cozy-lib.cnpg.image" (list $existingCluster "ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie" $) | fromYaml }}
metadata:
  name: seaweedfs-db
  {{- with $image.major }}
  annotations:
    postgres.cozystack.io/major: {{ . | quote }}
  {{- end }}
spec:
  instances: {{ .Values.db.replicas }}
  imageName: {{ $image.image }}
  storage:
    size: {{ .Values.db.size }}
    {{- with .Values.db.storageClass }}
    storageClass: {{ . }}
    {{- end }}

  monitoring:
    enablePodMonitor: true
  resources:
    {{- toYaml .Values.db.resources | nindent 4 }}
  inheritedMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
