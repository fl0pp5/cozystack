apiVersion: v1
data:
  MARIADB_OPERATOR_IMAGE: {{ include "cozy-lib.image" (list (include "image" (tuple .Values.image $.Chart.AppVersion)) $) | quote }}
  MARIADB_GALERA_LIB_PATH: "{{ .Values.config.galeraLibPath }}"
  MARIADB_DEFAULT_VERSION: "{{ .Values.config.mariadbDefaultVersion }}"
  RELATED_IMAGE_MARIADB: {{ include "cozy-lib.image" (list .Values.config.mariadbImage $) | quote }}
  RELATED_IMAGE_MARIADB_NAME: {{ include "cozy-lib.imageName" (list .Values.config.mariadbImageName $) | quote }}
  RELATED_IMAGE_MAXSCALE: {{ include "cozy-lib.image" (list .Values.config.maxscaleImage $) | quote }}
  RELATED_IMAGE_EXPORTER: {{ include "cozy-lib.image" (list .Values.config.exporterImage $) | quote }}
  RELATED_IMAGE_EXPORTER_MAXSCALE: {{ include "cozy-lib.image" (list .Values.config.exporterMaxscaleImage $) | quote }}
kind: ConfigMap
metadata:
  creationTimestamp: null
  name: mariadb-operator-env
