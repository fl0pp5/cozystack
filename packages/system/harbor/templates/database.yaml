---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
{{- $existingCluster := lookup "postgresql.cnpg.io/v1" "Cluster" .Release.Namespace (printf "%s-db" .Values.harbor.fullnameOverride) }}
{{- /* Through the image override table, keeping the major version the
       cluster runs; see cozy-lib.cnpg.image. */}}
{{- $image := include "cozy-lib.cnpg.image" (list $existingCluster "ghcr.io/cloudnative-pg/postgresql:17.7-standard-trixie" $) | fromYaml }}
metadata:
  name: {{ .Values.harbor.fullnameOverride }}-db
  {{- with $image.major }}
  annotations:
    postgres.cozystack.io/major: {{ . | quote }}
  {{- end }}
spec:
  instances: {{ .Values.db.replicas }}
  imageName: {{ $image.image }}
  storage:
    size: {{ .Values.db.size }}
    {{- with .Values.db.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  bootstrap:
    initdb:
      database: app
      owner: app
      encoding: UTF8
      localeCollate: en_US.UTF-8
      localeCType: en_US.UTF-8
  monitoring:
    enablePodMonitor: true
  resources:
    limits:
      cpu: "1"
      memory: 2048Mi
    requests:
      cpu: 100m
      memory: 512Mi
  inheritedMetadata:
    labels:
      policy.cozystack.io/allow-to-apiserver: "true"
