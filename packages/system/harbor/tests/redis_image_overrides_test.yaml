suite: Harbor's Redis follows the image override table

# The operator builds the Redis, Sentinel and exporter pods of Harbor's
# RedisFailover from its fields, which the post-renderer does not reach; the
# chart renders them through cozy-lib.image. Platform migration 54 pins the
# same Redis image into live objects and gets it from the migration hook.

release:
  name: harbor
  namespace: tenant-root

templates:
  - templates/redis.yaml

tests:
  - it: pins the upstream images without a table
    documentIndex: 1
    asserts:
      - equal: {path: spec.redis.image, value: "redis:6.2.6-alpine"}
      - equal: {path: spec.sentinel.image, value: "redis:6.2.6-alpine"}

  - it: renames the Redis it pins and its exporter
    documentIndex: 1
    set:
      _cluster:
        image-overrides:
          - name: redis
            match: {tag: 6.2.6-alpine}
            newName: registry.example.org/os/redis
          - name: oliver006/redis_exporter
            newName: registry.example.org/os/redis_exporter
    asserts:
      - equal: {path: spec.redis.image, value: "registry.example.org/os/redis:6.2.6-alpine"}
      - equal: {path: spec.sentinel.image, value: "registry.example.org/os/redis:6.2.6-alpine"}
      - equal:
          path: spec.redis.exporter.image
          value: registry.example.org/os/redis_exporter:v1.55.0@sha256:d82625bda93823fb40de881ffbb45b65aca772a39c30141387f92314c258da5d
