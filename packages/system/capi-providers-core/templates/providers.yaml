---
apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: CoreProvider
metadata:
  name: cluster-api
spec:
  # https://github.com/kubernetes-sigs/cluster-api
  version: v1.10.1-core
  fetchConfig:
    selector:
      matchLabels:
        core-components: cozy
  deployment:
    containers:
    - name: manager
      {{- $image := include "cozy-lib.image" (list .Values.managerImage $) }}
      {{- if ne $image .Values.managerImage }}
      imageUrl: {{ $image | quote }}
      {{- end }}
      resources:
        limits:
          cpu: 500m
          memory: 256Mi
        requests:
          cpu: 10m
          memory: 64Mi
