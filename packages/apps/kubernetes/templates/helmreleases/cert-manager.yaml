{{- define "cozystack.defaultCertManagerValues" -}}
{{- if $.Values.addons.gatewayAPI.enabled }}
cert-manager:
  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    enableGatewayAPI: true
{{- end }}
{{- end }}

{{- if and .Values.addons.certManager.enabled .Values._namespace.etcd }}
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: {{ .Release.Name }}-cert-manager
  labels:
    cozystack.io/repository: system
    cozystack.io/target-cluster-name: {{ .Release.Name }}
    sharding.fluxcd.io/key: tenants
spec:
  {{- include "cozy-lib.postRenderers" (list (list) $) | nindent 2 }}
  releaseName: cert-manager
  chartRef:
    kind: ExternalArtifact
    name: cozystack-kubernetes-application-kubevirt-kubernetes-cert-manager
    namespace: cozy-system
  kubeConfig:
    secretRef:
      name: {{ .Release.Name }}-admin-kubeconfig
      key: super-admin.svc
  targetNamespace: cozy-cert-manager
  storageNamespace: cozy-cert-manager
  interval: 5m
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: -1
  upgrade:
    remediation:
      retries: -1
  values:
    {{- $values := deepCopy .Values.addons.certManager.valuesOverride | mergeOverwrite (fromYaml (include "cozystack.defaultCertManagerValues" .)) }}
    {{- /* The controller starts ACME HTTP-01 solver pods from an image it takes
    as an argument, which the post-renderer above does not see; the chart
    takes it in parts, as on the management cluster (bundles/system.yaml in
    the platform chart). An image the tenant names in valuesOverride is its
    own choice and stays as written. */}}
    {{- $userImage := dig "cert-manager" "acmesolver" "image" dict (.Values.addons.certManager.valuesOverride | default dict) }}
    {{- if not (pick $userImage "registry" "repository" "name" "tag" "digest") }}
    {{-   with include "cozy-lib.imageOverrideValues" (list "quay.io/jetstack/cert-manager-acmesolver" (index (.Values._cluster | default dict) "image-overrides")) | fromYaml }}
    {{-     $values = mergeOverwrite $values (dict "cert-manager" (dict "acmesolver" (dict "image" .))) }}
    {{-   end }}
    {{- end }}
    {{- toYaml $values | nindent 4 }}
  dependsOn:
  - name: {{ .Release.Name }}-cilium
    namespace: {{ .Release.Namespace }}
  - name: {{ .Release.Name }}-cert-manager-crds
    namespace: {{ .Release.Namespace }}
{{- end }}
